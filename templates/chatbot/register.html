<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - AI Chatbot</title>
    <style>
        body {
            background-color: #131314;
            color: #e3e3e3;
            font-family: 'Google Sans', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background-color: #1e1f20;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; margin-bottom: 30px; }
        
        /* Django Form Styling Override */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px 0;
            background: #2b2c2f;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #8ab4f8;
            color: #131314;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .switch-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #8ab4f8;
            text-decoration: none;
            font-size: 14px;
        }
        .errorlist { color: #ff8a8a; list-style-type: none; padding: 0; font-size: 14px;}
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Create an Account</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register</button>
        </form>
        <a href="{% url 'login' %}" class="switch-link">Already have an account? Log in</a>
    </div>
</body>
</html>
