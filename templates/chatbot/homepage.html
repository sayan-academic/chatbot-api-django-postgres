<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CHATBOT</title>
    <style>
        :root {
            --bg-main: #131314;
            --bg-sidebar: #1e1f20;
            --text-main: #e3e3e3;
            --accent: #444746;
            --user-bubble: #2b2c2f;
            --link-blue: #8ab4f8;
            --sidebar-hover: #37393b;
        }

        body {
            font-family: 'Google Sans', Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        #sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            padding: 15px;
            border-right: 1px solid #333;
        }

        .new-chat-btn {
            background: #37393b;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #4a4c4e;
        }

        /* Sidebar History Items */
        .history-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
        }

        .history-item {
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
            transition: background 0.2s;
            color: #ccc;
        }

        .history-item:hover {
            background-color: var(--sidebar-hover);
            color: white;
        }

        /* Main Chat Area */
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px 15% 150px 15%; 
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        #chat-container::-webkit-scrollbar { width: 8px; }
        #chat-container::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        /* Message Styling */
        .message {
            max-width: 85%;
            line-height: 1.6;
            font-size: 16px;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-bubble);
            padding: 15px 20px;
            border-radius: 20px;
        }

        .bot-message {
            align-self: flex-start;
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .bot-message::before {
            content: "✦";
            background: linear-gradient(45deg, #4285f4, #9b72cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 24px;
            font-weight: bold;
        }

        /* Input Area Fix */
        #input-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(transparent, var(--bg-main) 30%);
            padding-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        #input-area {
            width: 70%;
            background: #1e1f20;
            border-radius: 28px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            transition: border 0.3s;
        }

        #input-area:focus-within {
            border: 1px solid #555;
        }

        #user-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            font-size: 16px;
            outline: none;
        }

        button#send-btn {
            background: transparent;
            color: var(--link-blue);
            font-weight: bold;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        button#send-btn:hover { color: #fff; }
    </style>
</head>
<body>

    <div id="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">+ New Chat</button>
        <p style="color: #888; font-size: 12px; margin-left: 10px;">Recent</p>
        <form method="POST" action="{% url 'chat:logout' %}" style="margin-top: auto; padding-top: 20px;">
            {% csrf_token %}
            <button type="submit" style="background: transparent; border: 1px solid #444; color: #888; width: 100%; padding: 10px; border-radius: 8px; cursor: pointer;">
                Logout
            </button>
        </form>
        <div class="history-list" id="sidebar-history">
            {% for msg in history %}
                {% if msg.role == 'user' %}
                    <div class="history-item" title="{{ msg.content }}">
                        {{ msg.content|truncatechars:25 }}
                    </div>
                {% endif %}
            {% endfor %}
        </div>
    </div>

    <div id="main-content">
        <div id="chat-container">
            <div class="message bot-message">
                Hello {{ request.user.username|title }}! I'm your assistant. History is now saved in the sidebar...
            </div>
            </div>

        <div id="input-wrapper">
            <form id="input-area">
                {% csrf_token %}
                <input type="text" id="user-input" placeholder="Enter a prompt here..." autocomplete="off">
                <button type="submit" id="send-btn">Send</button>
            </form>
        </div>
    </div>

   <script>
    const chatForm = document.getElementById('input-area');
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sidebarHistory = document.getElementById('sidebar-history');
    
    // NEW 1: Grab your submit button so we can control it
    const submitBtn = chatForm.querySelector('button[type="submit"]') || chatForm.querySelector('button');

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message) return;

        // NEW 2: STATE -> LOADING (Lock the UI immediately)
        // This makes it physically impossible to double-click and send a second request
        userInput.disabled = true;
        submitBtn.disabled = true;
        
        // Optional: Change the placeholder to show it's thinking
        userInput.placeholder = "Gemini is thinking...";

        // 1. Add User Message to UI
        const userDiv = document.createElement('div');
        userDiv.className = 'message user-message';
        userDiv.textContent = message;
        chatContainer.appendChild(userDiv);

        // Add to Sidebar History immediately (UX improvement)
        const historyItem = document.createElement('div');
        historyItem.className = 'history-item';
        historyItem.textContent = message.length > 25 ? message.substring(0, 22) + '...' : message;
        sidebarHistory.prepend(historyItem);
        
        userInput.value = '';
        chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });

        // 2. Send to Django Backend
        try {
            const response = await fetch('', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value,
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({'message': message})
            });

            const data = await response.json();

            // 3. Add AI Response to UI
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.textContent = data.response;
            chatContainer.appendChild(botDiv);
            
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            
        } catch (error) {
            console.error("Error calling the API:", error);
            // Optional: You could append a red "Error: Could not reach server" message here
        } finally {
            // NEW 3: STATE -> IDLE (Unlock the UI)
            // The 'finally' block is guaranteed to run, whether the 'try' succeeded OR the 'catch' triggered an error.
            userInput.disabled = false;
            submitBtn.disabled = false;
            userInput.placeholder = "Type your message here..."; // Reset placeholder
            userInput.focus(); // Automatically put the typing cursor back inside the input box
        }
    });
</script>
</body>
</html>
