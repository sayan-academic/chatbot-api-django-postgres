name: Database Garbage Collector

# 1. THE TRIGGER
on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # This adds a manual "Run" button to GitHub so you can test it

jobs:
  sweep_database:
    runs-on: ubuntu-latest # Boots up a free Linux server

    steps:
      # 2. DOWNLOAD YOUR CODE
      - name: Checkout code
        uses: actions/checkout@v4

      # 3. INSTALL PYTHON
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # Matches your Render environment

      # 4. INSTALL REQUIREMENTS
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. EXECUTE THE COMMAND
      - name: Run Django Garbage Collector
        env:
          # We will inject these secrets securely in step 2
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python manage.py clear_orphans